['M2','merge','乙醇梯度干燥',['M1','P7'],10,10,[['M2-1','摆放乙醇','25%、50%、70%、80%、90%乙醇按浓度相邻放在架子上。'],['M2-2','逐级浸没','塑料镊夹芯片到手心,再用弯头镊夹住,带着成像缓冲液依次浸没,每级10 s。',{p:['每级10 s'],cnt:5,seq:['25%','50%','70%','80%','90%'],w:'全程不能让芯片表面变干,连续进行。'}],['M2-3','风干','从90%取出,放手心,用塑料镊转到垫擦镜纸的干净培养皿风干。观察阵列处是否残留液滴,有则说明阵列有亲水性。']]]
].map(([id,t,n,d,e,h,s])=>({id,t,n,d,e,h,s:s.map(([i,sn,x,o])=>({i,n:sn,x,...(o||{})}))}));
const by=Object.fromEntries(S.map(s=>[s.id,s]));
// 关键路径
S.forEach(s=>{s.es=Math.max(0,...s.d.map(d=>by[d].ef));s.ef=s.es+s.e});
const total=Math.max(...S.map(s=>s.ef));
[...S].reverse().forEach(s=>{const nx=S.filter(x=>x.d.includes(s.id));s.lf=nx.length?Math.min(...nx.map(x=>x.lf-x.e)):total;s.crit=s.lf-s.ef<1});
// 行分配
const rows={};S.forEach(s=>{const r=rows[s.t]=rows[s.t]||[];let k=0;while(r[k]&&r[k]>s.es)k++;r[k]=s.ef;s.row=k});
const LS='origami-v1';let sv={};try{sv=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const done=new Set(sv.done||[]),cn=sv.cn||{},timers=(sv.timers||[]).map(t=>{const l=Math.max(0,t.left-(Date.now()-(sv.ts||Date.now()))/1000);return{...t,left:l,fin:t.fin||l<=0}});
let sel=sv.sel||'S1',view=null,speed=1;
function save(){try{localStorage.setItem(LS,JSON.stringify({done:[...done],cn,sel,ts:Date.now(),timers}))}catch(e){}}
const isDone=s=>s.s.every(x=>done.has(x.i));
const status=s=>isDone(s)?'done':!s.d.every(d=>isDone(by[d]))?'locked':(s.s.some(x=>done.has(x.i))||timers.some(t=>t.sid===s.id))?'in_progress':'ready';
const fmt=t=>{t=Math.max(0,Math.ceil(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
function drawTL(){
 $('#kpi').innerHTML=`<div><b>${(total/60).toFixed(1)} 小时</b><span>最短总时长</span></div><div><b>${S.filter(isDone).length}/${S.length}</b><span>阶段已完成</span></div><div><b>${S.filter(s=>status(s)==='ready').length}</b><span>现在可开始</span></div>`;
 $('#tl').innerHTML=Object.keys(T).map(t=>{const h=(Math.max(...S.filter(s=>s.t===t).map(s=>s.row))+1)*32;
  return `<div class="lane"><div class="lname" style="color:${T[t][1]}">${T[t][0]}</div><div class="lbody" style="height:${h}px">${S.filter(s=>s.t===t).map(s=>`<button class="bar ${status(s)} ${s.crit?'crit':''} ${s.id===sel?'sel':''}" style="--c:${T[t][1]};left:${s.es/total*100}%;width:${Math.max(s.e/total*100,2.2)}%;top:${s.row*32}px" data-id="${s.id}" title="${s.n} · 约${s.e}分钟">${s.n}</button>`).join('')}</div></div>`}).join('');
 document.querySelectorAll('.bar').forEach(b=>b.onclick=()=>{sel=b.dataset.id;view=null;render()});
}
function drawRun(){
 const s=by[sel],c=T[s.t][1],st=status(s),cur=s.s.findIndex(x=>!done.has(x.i)),vi=view??(cur<0?s.s.length-1:cur),x=s.s[vi],tm=timers.find(t=>t.sid===x.i);
 let h=`<span class="tag" style="--c:${c}">${T[s.t][0]}</span> <span class="tag">预计${s.e}分钟 · 动手${s.h}分钟</span><h2>${s.n}</h2>`;
 if(st==='locked'){h+=`<p class="empty">还不能开始:请先完成 ${s.d.filter(d=>!isDone(by[d])).map(d=>by[d].n).join('、')}。</p>`}
 h+=`<div class="dots" style="--c:${c}">${s.s.map((y,i)=>`<i class="${done.has(y.i)?'d':''} ${i===vi?'v':''}" data-i="${i}"></i>`).join('')}</div>`;
 h+=`<div class="step" style="--c:${c}"><h3>${x.n}</h3>${x.x}`;
 if(x.p)h+=`<div class="params">${x.p.map(p=>`<span>${p}</span>`).join('')}</div>`;
 if(x.w)h+=`<div class="warn">${x.w}</div>`;
 if(x.nt)h+=`<p class="sub">${x.nt}</p>`;if(x.cf)h+=`<div class="cf">待确认:${x.cf}</div>`;
 h+=`</div><div class="btns" style="--c:${c}">`;if(x.cnt&&!done.has(x.i)){const n=cn[x.i]||0;h+=`<button class="g" id="bc" ${st==='locked'||(n>=x.cnt&&x.seq)?'disabled':''}>${n>=x.cnt?'已达标 '+n+'/'+x.cnt:x.seq?'浸入 '+x.seq[n]+'('+n+'/'+x.cnt+')':'完成一次('+n+'/'+x.cnt+')'}</button>`}
 if(x.sec&&!done.has(x.i)){h+=tm?`<button class="g" id="bw" data-sid="${x.i}" disabled>计时中 ${fmt(tm.left)}</button>`:`<button class="g" id="bt" ${st==='locked'?'disabled':''}>开始计时 ${fmt(x.sec)}</button>`}
 h+=`<button class="p" id="bd" ${done.has(x.i)||st==='locked'||(tm&&!tm.fin)||(x.cnt&&(cn[x.i]||0)<x.cnt)?'disabled':''}>${done.has(x.i)?'已完成':'完成这一步'}</button>`;
 if(st!=='locked'&&!isDone(s))h+=`<button class="g" id="ball" title="演示用:一键完成本阶段以解锁后续">跳过本阶段(演示)</button>`;
 $('#run').innerHTML=h+'</div>';
 document.querySelectorAll('.dots i').forEach(i=>i.onclick=()=>{view=+i.dataset.i;drawRun()});
 const bc=$('#bc');if(bc)bc.onclick=()=>{cn[x.i]=(cn[x.i]||0)+1;save();drawRun()};const bt=$('#bt');if(bt)bt.onclick=()=>{timers.push({sid:x.i,stage:s.id,left:x.sec,total:x.sec,label:s.n+' · '+x.n,c,free:!!x.free,eq:x.eq});view=vi;render()};
 $('#bd').onclick=()=>{done.add(x.i);const k=timers.findIndex(t=>t.sid===x.i);if(k>=0)timers.splice(k,1);view=null;render()};
 const ba=$('#ball');if(ba)ba.onclick=()=>{s.s.forEach(y=>{done.add(y.i);const k=timers.findIndex(t=>t.sid===y.i);if(k>=0)timers.splice(k,1)});view=null;render()};
}
function drawSide(){
 const run=timers.filter(t=>t.free&&!t.fin);const busy=new Set(timers.filter(t=>!t.fin).map(t=>t.eq).filter(Boolean));
 if(!run.length){$('#side').innerHTML=`<div class="box"><h3 style="margin:0 0 6px">并行提示</h3><p class="empty">开始任意一个“免看守”计时(如丙酮超声、PCR退火),这里会列出等待期间可以同时做的事。</p></div>`;return}
 const w=Math.min(...run.map(t=>t.left));
 const sg=S.filter(s=>['ready','in_progress'].includes(status(s))&&s.id!==by[run[0].stage].id&&!s.s.some(x=>x.eq&&busy.has(x.eq))).map(s=>({s,fit:s.h*60<=w})).sort((a,b)=>b.fit-a.fit||a.s.h-b.s.h);
 $('#side').innerHTML=`<div class="box hint"><h3>等待中:现在可以同时做</h3><div class="sub">剩余等待约 ${fmt(w)}</div>${sg.length?sg.map(({s,fit})=>`<div class="it"><div><span style="color:${T[s.t][1]}">${s.n}</span><br><small>动手约${s.h}分钟 · ${fit?'等待时间内能做完':'超出本次等待'}</small></div><button class="g" style="--c:${T[s.t][1]}" data-go="${s.id}">去做</button></div>`).join(''):'<p class="empty">暂时没有可并行的阶段。</p>'}</div>`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{sel=b.dataset.go;view=null;render()});
}
function drawDock(){
 const d=$('#dock');d.innerHTML=(timers.length?timers.map(t=>`<div class="tm ${t.fin?'fin':''}" style="--c:${t.c}"><small>${t.label}</small><b>${t.fin?'时间到':fmt(t.left)}</b><div class="pb"><i style="width:${(1-t.left/t.total)*100}%"></i></div></div>`).join(''):'<span class="empty">没有运行中的计时器</span>')+`<div class="spd"><span>演示倍速</span><div>${[1,60,600].map(v=>`<button class="${v===speed?'on':''}" data-s="${v}">×${v}</button>`).join('')}</div><button id="rs">重置进度</button></div>`;$('#rs').onclick=()=>{done.clear();Object.keys(cn).forEach(k=>delete cn[k]);timers.length=0;sel='S1';view=null;render()};
 d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;drawDock()});
}
const $=q=>document.querySelector(q);
function render(){drawTL();drawRun();drawSide();drawDock();save()}
function initCalc(){const $i=id=>document.getElementById(id),v=id=>parseFloat($i(id).value);
 const f1=()=>{const nm=(v('a1')-v('a2'))/123735380*1e9;if(isNaN(nm)){$i('o1').textContent='输入A260和A330';return}const r=Math.round(nm);$i('o1').textContent=nm.toFixed(2)+' nM,参考浓度 '+r+' nM';$i('c1').value=r;f2()};
 const f2=()=>{const s=v('c1'),t=v('c2'),f=v('c3');if(!(s>0&&t>0&&f>0)){$i('o2').textContent='输入母液浓度';return}const u=t*f/(s*1000);$i('o2').textContent=u>f?'目标浓度高于母液':'取母液 '+u.toFixed(2)+' μL + 缓冲液 '+(f-u).toFixed(2)+' μL(稀释 '+(s*1000/t).toFixed(1)+' 倍)'};
 ['a1','a2'].forEach(i=>$i(i).oninput=f1);['c1','c2','c3'].forEach(i=>$i(i).oninput=f2)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
let last=Date.now();setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;let ch=false;
 timers.forEach(t=>{if(t.fin)return;t.left-=dt*speed;if(t.left<=0){t.left=0;t.fin=true;ch=true;beep()}});
 if(ch)render();else if(timers.length){drawDock();drawSide();const b=document.getElementById('bw');const t=b&&timers.find(t=>t.sid===b.dataset.sid);if(t&&!t.fin)b.textContent='计时中 '+fmt(t.left)}},250);
initCalc();render();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
