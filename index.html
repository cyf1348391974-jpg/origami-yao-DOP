['S1','chip','硅片清洗',[],40,20,[['S1-1','准备器具','3张无尘纸;玻璃皿垫擦镜纸;2个250 mL烧杯A、B,用Q水冲洗。'],['S1-2','丙酮超声','硅片放入A,倒入丙酮浸没,封口膜封口,放入超声清洗机并盖盖。',{p:['41%','10 min'],sec:600,free:1,eq:'超声机',w:'丙酮易燃,请在通风处操作。'}],['S1-3','异丙醇超声','A取出放无尘纸;硅片转入B,加异丙醇浸没,封口膜封口,超声。',{p:['41%','5 min'],sec:300,free:1,eq:'超声机'}],['S1-4','洗烧杯A(与上一步同时做)','丙酮倒入废液缸,依次用异丙醇、Q水清洗烧杯A。'],['S1-5','冲洗并吸干','弯头镊夹硅片,Q水冲洗;边缘靠无尘纸吸干背面;转入玻璃皿。']]],

 const plan=BATCHES.filter(b=>!(origamiReady&&b.id==='origami')).map(b=>{
   const ss=b.ids.map(id=>by[id]).filter(Boolean),doneN=ss.filter(isDone).length;
   const ready=ss.filter(s=>status(s)==='ready');
   const active=ss.some(s=>status(s)==='in_progress');
   const mins=Math.max(...ss.map(s=>s.e),0);
   return `<div class="it"><div><b>${b.name}</b><br><small>${doneN}/${ss.length} 完成 · 并行参考约${mins}分钟${active?' · 正在进行':''}</small>${ready.length?`<br><small style="color:${T[ready[0].t][1]}">现在可做：${ready.map(s=>s.n).join('、')}</small>`:''}</div>${ready.length?`<button class="g" style="--c:${T[ready[0].t][1]}" data-go="${ready[0].id}">${b.id===current?'继续本批':'开始本批'}</button>`:''}</div>`;
 }).join('');
 let waiting='';
 if(run.length){
   const w=Math.min(...run.map(t=>t.left));
   const sg=S.filter(s=>(s.t!=='prep'||!origamiReady)&&['ready','in_progress'].includes(status(s))&&s.id!==by[run[0].stage]?.id&&!s.s.some(x=>x.eq&&busy.has(x.eq))).map(s=>({s,fit:s.h*60<=w})).sort((a,b)=>b.fit-a.fit||a.s.h-b.s.h);
   waiting=`<div class="box hint"><h3>计时等待期间，继续做同批任务</h3><div class="sub">剩余等待约 ${fmt(w)}；建议不要空等</div>${sg.length?sg.map(({s,fit})=>`<div class="it"><div><span style="color:${T[s.t][1]}">${s.n}</span><br><small>动手约${s.h}分钟 · ${fit?'等待时间内能做完':'可先开始，完成后回来看计时'}</small></div><button class="g" style="--c:${T[s.t][1]}" data-go="${s.id}">去做</button></div>`).join(''):'<p class="empty">当前没有可安全并行的阶段。</p>'}</div>`;
 }
 $('#side').innerHTML=`<div class="box"><h3 style="margin:0 0 6px">实验时间安排</h3><p class="sub">系统已把可并行的工作合并成批次；优先完成同一批次，计时等待时切换到其他可做任务。</p>${plan}</div>${waiting}`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{sel=b.dataset.go;view=null;render()});
}
function drawDock(){
 const d=$('#dock');d.innerHTML=(timers.length?timers.map(t=>`<div class="tm ${t.fin?'fin':''}" style="--c:${t.c}"><small>${t.label}</small><b>${t.fin?'时间到':fmt(t.left)}</b><div class="pb"><i style="width:${(1-t.left/t.total)*100}%"></i></div></div>`).join(''):'<span class="empty">没有运行中的计时器</span>')+`<div class="spd"><span>演示倍速</span><div>${[1,60,600].map(v=>`<button class="${v===speed?'on':''}" data-s="${v}">×${v}</button>`).join('')}</div><button id="rs">重置进度</button></div>`;$('#rs').onclick=()=>{done.clear();Object.keys(cn).forEach(k=>delete cn[k]);timers.length=0;origamiReady=true;sel='S1';trk='chip';view=null;render()};
 d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;drawDock()});
}
const $=q=>document.querySelector(q);
function render(){drawTL();drawRun();drawSide();drawDock();save()}
function initCalc(){}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
let last=Date.now();setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;let ch=false;
 timers.forEach(t=>{if(t.fin)return;t.left-=dt*speed;if(t.left<=0){t.left=0;t.fin=true;ch=true;beep()}});
 if(ch)render();else if(timers.length){drawDock();drawSide();const b=document.getElementById('bw');const t=b&&timers.find(t=>t.sid===b.dataset.sid);if(t&&!t.fin)b.textContent='计时中 '+fmt(t.left)}},250);
initCalc();render();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
